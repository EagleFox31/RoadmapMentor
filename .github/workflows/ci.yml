name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    name: impact
    uses: EagleFox31/appfactory-project-automation/.github/workflows/reusable-impact-analysis.yml@9e351696d594c99059563f93140b492814f00679
    with:
      appfactory_ref: 9e351696d594c99059563f93140b492814f00679
      config_path: .github/appfactory-impact.json
      checkout_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'auto' }}

  verify:
    name: verify
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Regression tests
        run: npm test

  container-build:
    name: container-build
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'container-build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --target runtime -t roadmapmentor-ci .

  migrations:
    name: migrations
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'migrations') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roadmapmentor
          POSTGRES_PASSWORD: roadmapmentor
          POSTGRES_DB: roadmapmentor
        options: >-
          --health-cmd "pg_isready -U roadmapmentor -d roadmapmentor"
          --health-interval 5s --health-timeout 3s --health-retries 10
      db-proxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: ".*"
        ports:
          - 5444:80
    env:
      DATABASE_URL: postgresql://roadmapmentor:roadmapmentor@postgres:5432/roadmapmentor
      DATABASE_WS_PROXY: localhost:5444/v1
      DATABASE_WS_PROXY_INSECURE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schema matches committed migrations
        run: |
          npx drizzle-kit generate --name ci_drift_check
          git status --porcelain migrations
          test -z "$(git status --porcelain migrations)" || { echo "shared/schema.ts changed without a migration: run npm run db:generate"; exit 1; }

      - name: Build an empty database from migrations only
        run: npm run db:migrate

      - name: Migrations are idempotent
        run: npm run db:migrate

  integration:
    name: integration
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'integration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roadmapmentor
          POSTGRES_PASSWORD: roadmapmentor
          POSTGRES_DB: roadmapmentor
        options: >-
          --health-cmd "pg_isready -U roadmapmentor -d roadmapmentor"
          --health-interval 5s --health-timeout 3s --health-retries 10
      db-proxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: ".*"
        ports:
          - 5444:80
    env:
      DATABASE_URL: postgresql://roadmapmentor:roadmapmentor@postgres:5432/roadmapmentor
      DATABASE_WS_PROXY: localhost:5444/v1
      DATABASE_WS_PROXY_INSECURE: "true"
      JWT_SECRET: ci-only-secret
      RATE_LIMIT_AUTH_MAX: "1000"
      OBJECT_STORAGE_PROVIDER: filesystem
      PORT: "5055"
      TEST_BASE_URL: http://localhost:5055

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Start development server
        run: |
          npm run dev > "$RUNNER_TEMP/dev-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do curl -fs "$TEST_BASE_URL/health/ready" > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/dev-server.log"; exit 1

      - name: API integration tests (development server)
        run: npm run test:integration

      - name: Stop development server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" || true

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          NODE_ENV=production node dist/index.js > "$RUNNER_TEMP/prod-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do curl -fs "$TEST_BASE_URL/health/ready" > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/prod-server.log"; exit 1

      # Suites that provision users through scripts/create-mentor.ts only: the
      # dev-only create-test-users route does not exist in a production build.
      - name: API integration tests (production build)
        run: npx tsx --test test/integration/weeks-crud.integration.ts test/integration/sessions.integration.ts test/integration/change-requests.integration.ts test/integration/billing.integration.ts

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser journeys (production build)
        run: |
          python test/e2e/learner.e2e.py
          python test/e2e/mentor.e2e.py

      - name: Browser diagnostics
        if: failure()
        run: |
          curl -s -i "$TEST_BASE_URL/" | head -n 40
          tail -n 40 "$RUNNER_TEMP/prod-server.log"

      - name: Stop production server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" || true

  terraform-checks:
    name: terraform-checks
    needs: impact
    if: ${{ contains(fromJSON(needs.impact.outputs.gates), 'terraform-checks') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate staging contract
        run: |
          terraform -chdir=infra/terraform/environments/staging init -backend=false
          terraform -chdir=infra/terraform/environments/staging validate

      - name: Validate production contract
        run: |
          terraform -chdir=infra/terraform/environments/production init -backend=false
          terraform -chdir=infra/terraform/environments/production validate

      - name: Static Terraform lint
        working-directory: infra/terraform
        run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
