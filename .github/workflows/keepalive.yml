name: Keep-alive

# Filet GitHub uniquement. Le waker réel est le Worker Cloudflare
# infra/keepalive-worker (cron */10 → /health/live). GitHub ne tient pas
# un rythme de 10 minutes. URL surchargeable via HEALTHCHECK_URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.HEALTHCHECK_URL || 'https://roadmapmentor.onrender.com/health/live' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$URL"
