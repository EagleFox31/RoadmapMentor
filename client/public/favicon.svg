<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rm-grad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="rm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container for contrast across light and dark browser tabs -->
  <rect width="100" height="100" rx="24" fill="#090d16" />

  <!-- Outer Orbit Ring with openings -->
  <path
    d="M 23 63 A 33 33 0 1 1 74 27"
    stroke="url(#rm-grad)"
    stroke-width="4.5"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M 36 80 A 33 33 0 0 1 25 67"
    stroke="url(#rm-grad)"
    stroke-width="4.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Ascending Roadmap Path forming the 'M' -->
  <!-- Entry segment -->
  <line x1="22" y1="75" x2="35" y2="61" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Left vertical stem -->
  <line x1="35" y1="61" x2="35" y2="39" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Middle V of the M -->
  <line x1="35" y1="39" x2="50" y2="51" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="51" x2="65" y2="39" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Right vertical stem -->
  <line x1="65" y1="39" x2="65" y2="61" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Ascending arrow trajectory -->
  <line x1="65" y1="39" x2="77" y2="27" stroke="url(#rm-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Arrow Head -->
  <path
    d="M 72 23 L 83 21 L 81 32 Z"
    fill="url(#rm-grad)"
    stroke="url(#rm-grad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Milestone Nodes -->
  <!-- Node 1 (Entry) -->
  <circle cx="22" cy="75" r="4" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Node 2 (Bottom-left) -->
  <circle cx="35" cy="61" r="3.5" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Node 3 (Top-left of M) -->
  <circle cx="35" cy="39" r="4" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Node 4 (Center of M) -->
  <circle cx="50" cy="51" r="3.5" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Node 5 (Top-right of M) -->
  <circle cx="65" cy="39" r="4" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Node 6 (Bottom-right stem) -->
  <circle cx="65" cy="61" r="3.5" fill="#090d16" stroke="url(#rm-grad)" stroke-width="3" />
  <!-- Leading Milestone Node (Glowing on arrow branch) -->
  <circle cx="75" cy="29" r="3.5" fill="#ffffff" stroke="url(#rm-grad)" stroke-width="2.5" filter="url(#rm-glow)" />
</svg>
